name: Aggiorna prezzi settori

on:
  workflow_dispatch:   # avvio manuale: pulsante "Run workflow" nella scheda Actions
  # Quando il test funziona, qui si aggiunge l'avvio automatico ogni mattina.

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa yfinance
        run: pip install --upgrade yfinance

      - name: Scarica i prezzi
        run: python fetch_prices.py

      - name: Salva data.json nel repository
        if: always()
        run: |
          if [ -f data.json ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data.json
            git diff --cached --quiet || git commit -m "Aggiorna data.json"
            git push
          fi
